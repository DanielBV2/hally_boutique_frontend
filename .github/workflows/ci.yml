name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs previos en la misma rama (evita uso innecesario de minutos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las pruebas unitarias no dependen del build: corren rápido y fallan
      # temprano si algo se rompe.
      - name: Tests
        run: npm run test

      # El build va ANTES de typecheck: `next build` genera los tipos de
      # rutas tipadas (LayoutProps/PageProps) en .next/types/, necesarios
      # para que `tsc --noEmit` resuelva esos globales. En un runner limpio
      # no existe .next previo, así que sin build primero typecheck
      # fallaría con "Cannot find name 'LayoutProps'". Además next build ya
      # ejecuta su propio chequeo de tipos.
      - name: Build
        run: npm run build
        # El build no necesita env vars reales: NEXT_PUBLIC_* tiene
        # fallback por defecto en el código.
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          EXPRESS_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # E2E con Playwright contra un backend REAL.
  #
  # Los tests E2E del frontend no se pueden mockear: necesitan la API de Express
  # (registro, carrito, órdenes, checkout). Por eso este job clona el repo
  # hermano hally_boutique_backend, lo levanta contra un Postgres efímero
  # sembrado con seed:e2e, y recién ahí corre Playwright.
  #
  # `needs: build` evita gastar minutos de runner levantando todo esto cuando
  # el build/lint/tests unitarios ya fallaron.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    # Margen holgado: install de Chromium con --with-deps + build del backend
    # + 2 tests E2E. Corta antes de agotar la hora por defecto si algo se cuelga.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hallyboutique_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout (frontend)
        uses: actions/checkout@v4

      # El backend es un repo hermano. Es público, así que no hace falta token.
      # Se clona en backend-e2e/ para no ensuciar la raíz del frontend.
      - name: Checkout (backend)
        uses: actions/checkout@v4
        with:
          repository: DanielBV2/hally_boutique_backend
          path: backend-e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Cachea ambos lockfiles: el checkout del backend ocurre antes de
          # este step, así que las dos rutas ya existen cuando se resuelve.
          cache-dependency-path: |
            package-lock.json
            backend-e2e/package-lock.json

      # ---- Backend: preparar la base de datos y el servidor -----------------
      - name: Backend — instalar dependencias
        working-directory: backend-e2e
        run: npm ci

      - name: Backend — compilar
        working-directory: backend-e2e
        run: npm run build

      # .env.test está commiteado en el backend (valores dummy, no secretos) y
      # trae DATABASE_URL apuntando a localhost:5433/hallyboutique_test, que es
      # exactamente el servicio Postgres de arriba. dotenv-cli lo inyecta en el
      # entorno del proceso hijo.
      - name: Backend — migraciones
        working-directory: backend-e2e
        run: npx dotenv -e .env.test -- npx prisma migrate deploy

      # seed:e2e ya envuelve dotenv -e .env.test por su cuenta. Es idempotente
      # (upserts), y crea la categoría/producto/variantes que usa checkout.spec.
      - name: Backend — seed E2E
        working-directory: backend-e2e
        run: npm run seed:e2e

      # El servidor compilado corre en background esperando /health, que además
      # hace un SELECT 1 a la DB: no devuelve 200 hasta que la base está
      # realmente lista. Se espera con un loop de curl, no con un sleep fijo.
      - name: Backend — arrancar y esperar /health
        working-directory: backend-e2e
        run: |
          nohup npx dotenv -e .env.test -- npm run start > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3010/health; then
              echo ""
              echo "Backend listo (intento $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no respondió /health dentro del tiempo esperado"
          cat backend-e2e.log || true
          exit 1

      # ---- Frontend: correr Playwright --------------------------------------
      - name: Frontend — instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts ya apunta EXPRESS_API_URL a
      # http://localhost:3010/api (puerto del backend de arriba) y levanta el
      # dev server del frontend en el 3001.
      - name: E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
