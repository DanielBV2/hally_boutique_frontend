name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs previos en la misma rama (evita uso innecesario de minutos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        # El build no necesita env vars reales: NEXT_PUBLIC_* tiene
        # fallback por defecto en el código.
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
